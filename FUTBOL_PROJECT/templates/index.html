{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoutProject - Wonderkid List</title>
    <style>
        /* Body Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("{% static 'images/saha.png' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        .page-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            min-height: 100vh;
            width: 100%;
            padding-bottom: 120px; /* Panel icin bosluk */
        }

        /* Header */
        .main-header {
            text-align: center;
            padding: 60px 20px 20px 20px;
        }

        .main-header h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
        }

        .header-divider {
            width: 80px;
            border: 2px solid #007bff;
            margin: 20px auto;
        }

        /* Container */
        .scout-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Player Card */
        .player-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            color: #333;
            position: relative;
        }

        .player-card:hover {
            transform: translateY(-10px);
        }

        .player-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .compare-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 10;
        }

        .player-info {
            padding: 20px;
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .player-stats {
            margin-top: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
        }

        .stat-bar-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
            margin-top: 4px;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00d4ff);
        }

        /* Comparison Panel */
        #compare-panel {
            position: fixed;
            bottom: -200px;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            color: #222;
            padding: 20px;
